<style>
:root {
  --pers-navy: #0B132B;
  --pers-blue: #0052FF;
  --pers-cyan: #00A3E0;
  --pers-cyan-bg: #E6FAFF;
  --pers-bg: #F4F6FB;
  --pers-card: #FFFFFF;
  --pers-text: #0F172A;
  --pers-muted: #64748B;
  --pers-border: #E2E8F0;
  --danger: #EF4444;
  --warning: #F59E0B;
  --pers-green: #10B981;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--pers-bg); color: var(--pers-text); font-size: 13px; }

/* Pantalla de Login */
#login-screen {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  background: radial-gradient(circle at 50% 20%, #1E293B 0%, #0B132B 70%, #030712 100%);
  display: flex; align-items: center; justify-content: center; z-index: 1000;
}
.login-box {
  background: #ffffff;
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 24px; padding: 40px 36px; width: 420px; max-width: 90%;
  box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5), 0 0 30px rgba(0, 163, 224, 0.15);
  text-align: center;
}

.login-logos {
  display: flex; justify-content: center; align-items: center; gap: 16px; margin-bottom: 24px;
}
.brand-divider {
  width: 1px; height: 38px; background: var(--pers-border); opacity: 0.8;
}

.login-box h2 { margin: 0 0 6px; font-size: 22px; font-weight: 800; color: var(--pers-navy); letter-spacing: -0.5px; }
.login-box p { margin: 0 0 26px; font-size: 13px; color: var(--pers-muted); }

.field-group { text-align: left; margin-bottom: 18px; }
.field-group label { display: block; font-weight: 700; font-size: 11px; text-transform: uppercase; margin-bottom: 6px; color: var(--pers-navy); letter-spacing: 0.5px; }
.field-group input { width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--pers-border); font-size: 13px; transition: all 0.2s; }
.field-group input:focus { outline: none; border-color: var(--pers-blue); box-shadow: 0 0 0 3px rgba(0,82,255,0.18); }

.btn-login {
  width: 100%; padding: 13px; border: 0; border-radius: 12px;
  background: linear-gradient(135deg, var(--pers-blue) 0%, #0036B3 100%);
  color: #fff; font-weight: 800; font-size: 14px; cursor: pointer;
  box-shadow: 0 4px 14px rgba(0,82,255,0.35); transition: all 0.15s ease; margin-top: 6px;
}
.btn-login:hover { filter: brightness(1.1); transform: translateY(-1px); }
.btn-login:active { transform: translateY(1px); }
.login-err { color: var(--danger); font-size: 12px; font-weight: 700; margin-top: 14px; display: none; background: #FEE2E2; padding: 8px; border-radius: 8px; }

/* Modal de Cambio de Contraseña */
#pwd-modal {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  background: rgba(11, 19, 43, 0.6); backdrop-filter: blur(4px);
  z-index: 2000; display: none; align-items: center; justify-content: center;
}

/* Header App */
header { background: var(--pers-navy); color: #fff; padding: 12px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; position: sticky; top: 0; z-index: 10; box-shadow: 0 4px 12px rgba(11, 19, 43, 0.25); }
.brand { display: flex; align-items: center; gap: 12px; margin-right: 12px; }
.brand-logos-hdr { display: flex; align-items: center; gap: 10px; }
h1 { font-size: 17px; margin: 0; font-weight: 800; letter-spacing: -0.4px; color: #fff; }

/* Botones & Controls */
button, select, input { font-family: inherit; font-size: 12px; border: 1px solid var(--pers-border); border-radius: 20px; padding: 6px 14px; transition: all .15s ease; }
button { cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
header button { background: rgba(255,255,255,0.08); color: #fff; border: 1px solid rgba(255,255,255,0.18); }
header button:hover { background: rgba(255,255,255,0.2); }
header button.on { background: var(--pers-blue); color: #fff; border-color: var(--pers-blue); box-shadow: 0 2px 8px rgba(0,82,255,0.5); }
header select, header input { background: #fff; color: var(--pers-navy); font-weight: 600; }
header input { width: 60px; text-align: center; }
header label { font-size: 12px; opacity: 0.9; }
.sp { flex: 1; }

/* Botón de Guardar e Indicador de Cambios */
.btn-save {
  background: rgba(255,255,255,0.12);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.3);
  font-weight: 700;
  padding: 6px 14px;
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.2s ease;
}
.btn-save:hover { background: rgba(255,255,255,0.25); }
.btn-save.unsaved-active {
  background: var(--warning) !important;
  color: #0F172A !important;
  border-color: #D97706 !important;
  font-weight: 800 !important;
  animation: pulse-save 1.5s infinite;
}
@keyframes pulse-save {
  0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
  70% { transform: scale(1.03); box-shadow: 0 0 0 8px rgba(245, 158, 11, 0); }
  100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
}

.user-badge { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25); padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 6px; }
.role-chip { background: var(--pers-cyan); color: #fff; padding: 1px 6px; border-radius: 8px; font-size: 9px; font-weight: 900; text-transform: uppercase; }

.sync-badge { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.22); padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pers-cyan); display: inline-block; box-shadow: 0 0 6px var(--pers-cyan); }
.sync-dot.busy { background: #FACC15; box-shadow: 0 0 6px #FACC15; animation: pulse 1s infinite; }
.sync-dot.err { background: var(--danger); box-shadow: 0 0 6px var(--danger); }

@keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }

/* Dashboard & Cards */
main { padding: 20px; max-width: 1600px; margin: 0 auto; }
.card { background: var(--pers-card); border-radius: 14px; padding: 18px; margin-bottom: 16px; border: 1px solid var(--pers-border); box-shadow: 0 2px 8px rgba(15,23,42,0.04); }
h3 { margin: 0 0 14px; font-size: 15px; color: var(--pers-navy); font-weight: 700; display: flex; align-items: center; justify-content: space-between; }

/* KPIs */
.kp { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 18px; }
.kp .card { margin: 0; border-left: 5px solid var(--pers-blue); }
.kp.district .card { border-left-color: var(--pers-cyan); background: #FAFCFF; }
.kp b { display: block; font-size: 24px; color: var(--pers-navy); font-weight: 800; line-height: 1.2; }
.kp span { color: var(--pers-muted); font-size: 12px; font-weight: 500; }

/* Tabla Heatmap */
.wrap { overflow: auto; max-height: 70vh; border-radius: 10px; border: 1px solid var(--pers-border); }
table { border-collapse: separate; border-spacing: 0; width: 100%; }
.hm td, .hm th { border-right: 1px solid #E2E8F0; border-bottom: 1px solid #E2E8F0; text-align: center; font-size: 11px; min-width: 34px; height: 32px; padding: 0 3px; }
.hm td { cursor: pointer; transition: filter .1s; }
.hm td.sel { outline: 2px solid var(--pers-blue); outline-offset: -2px; }
.hm td:hover { filter: brightness(0.92); }
.hm th { background: #F1F5F9; color: var(--pers-navy); font-weight: 700; position: sticky; top: 0; z-index: 1; }
.hm thead tr+tr th { top: 32px; }
.hm th.m { background: var(--pers-navy); color: #fff; }
.hm th.r { position: sticky; left: 0; z-index: 2; text-align: left; min-width: 210px; padding: 0 10px; background: #F8FAFC; font-weight: 600; color: var(--pers-navy); }
.hm th.r small { float: right; color: var(--pers-muted); font-weight: 400; }
.hm thead th.r { top: 0; z-index: 3; background: var(--pers-navy); color: #fff; }
.hm tfoot th, .hm tfoot td { font-weight: 800; background: #E2E8F0; }
.hm tfoot tr.district-total th, .hm tfoot tr.district-total td { background: var(--pers-navy); color: #fff; border-top: 2px solid var(--pers-cyan); }

/* Celda Cian Vacaciones */
.x { background: var(--pers-cyan) !important; color: #fff !important; font-weight: 900; font-size: 12px; }
.pl td { background: #fff; }
.pl tr:nth-child(even) td { background: #FAFCFF; }

/* Badges & Chips */
.wk-chip { display: inline-block; background: var(--pers-cyan-bg); color: #006699; border: 1px solid #B3F3FF; border-radius: 12px; padding: 2px 8px; font-size: 10px; font-weight: 700; margin: 2px; }
.badge-off { background: #EFF6FF; color: var(--pers-blue); padding: 2px 7px; border-radius: 10px; font-size: 10px; font-weight: 600; }
.badge-dist { background: #F3E8FF; color: #7C3AED; padding: 2px 7px; border-radius: 10px; font-size: 10px; font-weight: 600; }

/* Leyenda */
.lg { display: flex; gap: 16px; font-size: 11px; margin: 12px 0 0; align-items: center; flex-wrap: wrap; color: var(--pers-muted); }
.lg i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -3px; margin-right: 4px; }

/* Tabs */
.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.tabs button { background: #fff; border: 1px solid var(--pers-border); color: var(--pers-navy); border-radius: 20px; padding: 6px 16px; }
.tabs button.on { background: var(--pers-navy); color: #fff; border-color: var(--pers-navy); box-shadow: 0 2px 6px rgba(11,19,43,0.3); }

/* Form & ABM */
.btn { background: var(--pers-blue); color: #fff; border: 0; }
.btn:hover { background: #0043D6; }
.del { background: #FEE2E2; color: var(--danger); border: 1px solid #FCA5A5; }
.del:hover { background: #FCA5A5; }
.f { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
input[type=text], input[type=password], select { border: 1px solid var(--pers-border); background: #fff; padding: 6px 12px; border-radius: 8px; }
.tb { width: 100%; border-collapse: collapse; }
.tb th { text-align: left; color: var(--pers-muted); font-weight: 700; padding: 8px; border-bottom: 2px solid var(--pers-border); }
.tb td { padding: 8px; border-bottom: 1px solid #EEF2F7; vertical-align: middle; }
.tb input { width: 100%; }
.item-box { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; background: #F8FAFC; padding: 8px 12px; border-radius: 8px; }

.tech-detail { background: #F0FDFA; border: 1px solid #99F6E4; padding: 16px; border-radius: 12px; }
ol { margin: 0; padding-left: 18px; }
li { padding: 6px 0; border-bottom: 1px solid #F1F5F9; cursor: pointer; }
li:hover { color: var(--pers-blue); }
</style>
<style>

.abm-t{width:100%;border-collapse:collapse}

.abm-t td input.num{width:80px;text-align:center}

.addbox.open{display:flex}

#as-modal.open{display:flex}
.as-box{background:#fff;border-radius:12px;padding:26px 28px;width:460px;box-shadow:0 30px 70px rgba(0,0,0,.35)}

.as-box label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#41506A;margin:10px 0 4px}
.as-box select{width:100%;padding:8px 10px}
.as-r{display:grid;grid-template-columns:1fr 1fr;gap:12px}

const $=s=>document.querySelector(s), MES=['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
const e=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

const isExcludedOffice = o => {
  const s = String(o || '').trim().toLowerCase();
  return s === 'supervisores' || s.startsWith('ms');

let S = JSON.parse(JSON.stringify(SEED));
let V='d', F='ALL', DIST='ALL', SEL=null, nid=45;
let currentUser = null;
let hasUnsavedChanges = false;

function markUnsaved() {
  hasUnsavedChanges = true;
  updateSaveButtonUI();
}

function updateSaveButtonUI() {
  const btn = $('#btn-save');
  if (!btn) return;
  if (hasUnsavedChanges) {
    btn.classList.add('unsaved-active');
    btn.innerHTML = '⚠️ Guardar Cambios';
  } else {
    btn.classList.remove('unsaved-active');
    btn.innerHTML = '💾 Guardado';
  }
}

function logAction(act) {
  if (!Array.isArray(S.logs)) S.logs = [];
  const d = new Date();
  const timestamp = d.toLocaleDateString('es-AR') + ' ' + d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  S.logs.unshift({
    u: currentUser ? currentUser.u : 'Sistema',
    a: act,
    t: timestamp
  });
  if (S.logs.length > 300) S.logs.pop();
}

function normalizeData() {
  if (!S.d || !Array.isArray(S.d) || S.d.length === 0) {
    S.d = ["Bella Vista"];
  }
  if (!Array.isArray(S.users) || S.users.length === 0) {
    S.users = [{ u: "kruki", p: "", r: "admin" }];
  } else {
    if (!S.users.some(x => x.u.toLowerCase() === 'kruki')) {
      S.users.push({ u: "kruki", p: "", r: "admin" });
    }
  }
  if (!Array.isArray(S.logs)) S.logs = [];
  if (Array.isArray(S.o)) {
    S.o = S.o.map(of => {
      if (typeof of === 'string') return { n: of, d: "Bella Vista" };
      return of;
    });
  } else {
    S.o = [];
  }
  if (!Array.isArray(S.t)) S.t = [];
}

function setSyncStatus(state, msg) {
  const dot = $('#sync-dot'), txt = $('#sync-text');
  if (!dot || !txt) return;
  dot.className = 'sync-dot ' + (state === 'busy' ? 'busy' : state === 'err' ? 'err' : '');
  txt.textContent = msg;
}

async function loadData(manual = false) {
  if (manual && hasUnsavedChanges) {
    if (!confirm('⚠️ Tenés cambios sin guardar en tu pantalla.\n\nSi recargás desde la nube perderás los cambios no guardados. ¿Deseás continuar?')) {
      return;
    }
  }

  setSyncStatus('busy', manual ? 'Actualizando...' : 'Conectando...');
  try {
    const res = await fetch(API_URL + '/latest', {
      headers: { 'X-Master-Key': MASTER_KEY }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data.record) {
      S = data.record;
      normalizeData();
    } else {
      S = JSON.parse(JSON.stringify(SEED));
    }
    nid = Math.max(0, ...S.t.map(t => t.id));
    hasUnsavedChanges = false;
    updateSaveButtonUI();
    setSyncStatus('ok', 'Sincronizado');
  } catch(err) {
    console.error('Error al cargar de JSONBin:', err);
    normalizeData();
    setSyncStatus('err', 'Sin conexión');
  }
  
  if (currentUser) {
    render();
  }
}

async function saveData() {
  setSyncStatus('busy', 'Guardando...');
  try {
    const res = await fetch(API_URL, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': MASTER_KEY
      },
      body: JSON.stringify(S)
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    hasUnsavedChanges = false;
    updateSaveButtonUI();
    setSyncStatus('ok', 'Guardado en Nube');
    setTimeout(() => setSyncStatus('ok', 'Sincronizado'), 2000);
  } catch(err) {
    console.error('Error al guardar en JSONBin:', err);
    setSyncStatus('err', 'Error al guardar');
    alert('❌ Ocurrió un error al intentar guardar en la nube. Revisa tu conexión a internet.');
  }
}

/* MANEJO DE SESIÓN PERSISTENTE */
function checkSavedSession() {
  const savedUserJson = sessionStorage.getItem('vacations_user');
  if (savedUserJson) {
    try {
      const uSaved = JSON.parse(savedUserJson);
      normalizeData();
      const found = S.users.find(x => x.u.toLowerCase() === uSaved.u.toLowerCase());
      if (found) {
        currentUser = found;
        showAppUI();
        loadData();
        return;
      }
    } catch(e) {}
  }
  showLoginUI();
  loadData();
}

function showAppUI() {
  $('#login-screen').style.display = 'none';
  $('#main-header').style.display = 'flex';
  $('#app').style.display = 'block';
  render();
}

function showLoginUI() {
  $('#login-screen').style.display = 'flex';
  $('#main-header').style.display = 'none';
  $('#app').style.display = 'none';
}

function doLogin(evt) {
  evt.preventDefault();
  const uInput = $('#l-user').value.trim().toLowerCase();
  const pInput = $('#l-pass').value.trim();

  normalizeData();
  const found = S.users.find(x => x.u.toLowerCase() === uInput);

  if (found && (found.p || '') === pInput) {
    currentUser = found;
    sessionStorage.setItem('vacations_user', JSON.stringify({ u: found.u }));
    logAction('Inició sesión en el sistema');
    $('#l-err').style.display = 'none';
    showAppUI();
  } else {
    $('#l-err').style.display = 'block';
  }
}

function doLogout() {
  if (hasUnsavedChanges) {
    if (!confirm('⚠️ Tenés cambios pendientes que NO fueron guardados en la nube.\n\n¿Estás seguro de cerrar sesión y perder los cambios no guardados?')) {
      return;
    }
  }
  if (currentUser) {
    logAction('Cerró sesión');
  }
  sessionStorage.removeItem('vacations_user');
  currentUser = null;
  hasUnsavedChanges = false;
  $('#l-user').value = '';
  $('#l-pass').value = '';
  showLoginUI();
}

/* ADVERTENCIA AL CERRAR / RECARGAR LA PESTAÑA DEL NAVEGADOR */
window.addEventListener('beforeunload', function (e) {
  if (hasUnsavedChanges) {
    e.preventDefault();
    e.returnValue = 'Tenés cambios sin guardar en el sistema. ¿Deseás salir de todas formas?';
    return e.returnValue;
  }
});

/* MODAL CAMBIO DE CONTRASEÑA */
function openChangePwdModal() {
  $('#pwd-old').value = '';
  $('#pwd-new').value = '';
  $('#pwd-confirm').value = '';
  $('#pwd-err').style.display = 'none';
  $('#pwd-modal').style.display = 'flex';
}

function saveNewPwd(evt) {
  evt.preventDefault();
  const oldP = $('#pwd-old').value.trim();
  const newP = $('#pwd-new').value.trim();
  const confP = $('#pwd-confirm').value.trim();
  const errDiv = $('#pwd-err');

  if (currentUser.p && oldP !== currentUser.p) {
    errDiv.textContent = 'La contraseña actual no es correcta.';
    errDiv.style.display = 'block';
    return;
  }
  if (!newP) {
    errDiv.textContent = 'La nueva contraseña no puede estar vacía.';
    errDiv.style.display = 'block';
    return;
  }
  if (newP !== confP) {
    errDiv.textContent = 'Las nuevas contraseñas no coinciden.';
    errDiv.style.display = 'block';
    return;
  }

  currentUser.p = newP;
  const uObj = S.users.find(x => x.u.toLowerCase() === currentUser.u.toLowerCase());
  if (uObj) uObj.p = newP;

  logAction('Cambió su propia contraseña');
  markUnsaved();
  $('#pwd-modal').style.display = 'none';
  alert('✅ Contraseña actualizada correctamente. No olvides presionar "Guardar Cambios".');
}

const wk=y=>{ let d=Date.UTC(y,0,1); while(new Date(d).getUTCDay()!=1) d+=864e5; return [...Array(52)].map((_,i)=>d+i*6048e5); };
const iso=t=>new Date(t).toISOString().slice(0,10), p2=n=>String(n).padStart(2,'0');
const fmt=t=>{ const d=new Date(t); return p2(d.getUTCDate())+'/'+p2(d.getUTCMonth()+1); };
const lab=t=>fmt(t)+' – '+fmt(t+6*864e5);

const mh=W=>{
  let h='', i=0;
  while(i<W.length){
    const m=new Date(W[i]).getUTCMonth(); let j=i;
    while(j<W.length && new Date(W[j]).getUTCMonth()==m) j++;
    h+=`<th colspan=${j-i} class=m>${MES[m]}</th>`; i=j;
  }
  return h;
};

const heat=(p)=>{
  const u=S.u/100;
  if(p<=0) return ['#F4F6FB','#64748B'];
  if(p<.9*u) return ['#E6FAFF','#007799'];
  if(p<=u) return ['#FEF3C7','#92400E'];
  return ['#FEE2E2','#B91C1C'];
};

const cell=(c,n,tt,i,isDistrict=false)=>{
  const p=n?c/n:0, [bg,fg]=heat(p);
  const extraClass = isDistrict ? 'font-weight:bold;' : '';
  return `<td style="background:${bg};color:${fg};${extraClass}" title="${e(tt)}" class="${SEL==i?'sel':''}" ${i>=0?`onclick="SEL=${i};render()"`:''}>${c||''}</td>`;
};

function getFilteredOffices() {
  return DIST === 'ALL' ? S.o : S.o.filter(o => o.d === DIST);
}

function getFilteredTechs() {
  const offices = getFilteredOffices().map(o => o.n);
  return S.t.filter(t => offices.includes(t.o));
}

function getTechDistrict(tech) {
  const off = S.o.find(o => o.n === tech.o);
  return off ? off.d : (S.d[0] || 'Bella Vista');
}

/* --- VISTA: DASHBOARD / RESUMEN GENERAL --- */
function dash(){
  const W=wk(S.y), K=W.map(iso);
  const activeOffices = getFilteredOffices();
  const activeTechs = getFilteredTechs();

  const calcTechs = activeTechs.filter(t => !isExcludedOffice(t.o));
  const calcOffices = activeOffices.filter(o => !isExcludedOffice(o.n));
  const N = calcTechs.length || 1, u = S.u / 100;

  const R = activeOffices.map(o => {
    const ts = activeTechs.filter(t => t.o === o.n);
    return { o: o.n, d: o.d, n: ts.length, c: K.map(k => ts.filter(t => t.w.includes(k)).length) };
  });

  const tot = K.map((_,i) => R.reduce((a,r) => isExcludedOffice(r.o) ? a : a + r.c[i], 0));
  const mx = Math.max(...tot), pk = tot.indexOf(mx), sum = tot.reduce((a,b) => a + b, 0);
  const over = tot.filter(x => x / N > u).length;

  const top = tot.map((c,i) => [c,i]).filter(x => x[0]).sort((a,b) => b[0] - a[0]).slice(0,6)
    .map(([c,i]) => `<li onclick="SEL=${i};render()"><b>Semana del ${lab(W[i])}</b><br><span style="color:var(--pers-blue);font-weight:700">${c} técnicos</span> (${Math.round(c/N*100)}% del total)</li>`).join('')
    || '<li>Sin vacaciones programadas en este año.</li>';

  const det = SEL == null ? '' : `<div class="card tech-detail" style="margin:0"><h3>Detalle Semana ${lab(W[SEL])} (${DIST === 'ALL' ? 'Todos los Distritos' : 'Distrito ' + e(DIST)})</h3>${
    activeOffices.map(o => {
      const n = activeTechs.filter(t => t.o === o.n && t.w.includes(K[SEL]));
      return n.length ? `<p style="margin:4px 0"><b>${e(o.n)}</b> [${e(o.d)}] (${n.length}):${n.map(t => `<span class="wk-chip">${e(t.n)}</span>`).join(' ')}</p>` : '';
    }).join('') || '<p>Sin personal de vacaciones esta semana.</p>'
  }</div>`;

  return `
  <div class="card" style="background: linear-gradient(135deg, #0B132B 0%, #0052FF 100%); color:#fff;">
    <h2 style="margin:0 0 6px; font-size:20px; font-weight:800;">
      Resumen ${DIST === 'ALL' ? 'General Consolidado' : 'Distrito ' + e(DIST)} (${S.y})
    </h2>
    <p style="margin:0; opacity:0.9;">Monitoreo de ausentismo y dotación por oficina técnica.</p>
  </div>

  <div class="kp district">
    <div class="card"><b>${calcTechs.length}</b><span>Técnicos Totales (Cálculo)</span></div>
    <div class="card"><b>${calcOffices.length}</b><span>Oficinas Técnicas</span></div>
    <div class="card"><b>${sum}</b><span>Semanas Asignadas (${S.y})</span></div>
    <div class="card"><b>${mx ? Math.round(mx/N*100) + '%' : '-'}</b><span>Pico Max: ${mx} téc. (${pk >= 0 ? fmt(W[pk]) : ''})</span></div>
    <div class="card" style="border-left-color:${over ? 'var(--danger)' : 'var(--pers-cyan)'}"><b>${over}</b><span>Semanas s/ umbral (${S.u}%)</span></div>
  </div>

  <div class="card">
    <h3>Matriz de Ausentismo por Oficina (${S.y})</h3>
    <div class="wrap">
      <table class="hm">
        <thead>
          <tr><th class="r" rowspan="2">Oficina / Distrito</th>${mh(W)}<th class="m" rowspan="2">Σ Total</th></tr>
          <tr>${W.map(t=>`<th title="${lab(t)}">${fmt(t)}</th>`).join('')}</tr>
        </thead>
        <tbody>
          ${R.map(r=>`
            <tr>
              <th class="r">
                ${e(r.o)}${DIST==='ALL'?`<span class="badge-dist">${e(r.d)}</span>`:''}
                <small>${r.n} téc.</small>
              </th>
              ${r.c.map((c,i)=>cell(c, r.n, `${r.o} [${r.d}]: ${c}/${r.n} téc. (${r.n?Math.round(c/r.n*100):0}%) · ${lab(W[i])}`, -1)).join('')}
              <th>${r.c.reduce((a,b)=>a+b,0)}</th>
            </tr>
          `).join('')}
        </tbody>
        <tfoot>
          <tr class="district-total">
            <th class="r" style="background:var(--pers-navy); color:#fff">TOTAL TÉCNICOS <small style="color:#A5B4FC">${calcTechs.length}</small></th>
            ${tot.map((c,i)=>cell(c, N, `Total: ${c}/${N} (${Math.round(c/N*100)}\%) ·${lab(W[i])}`, i, true)).join('')}
            <th style="background:var(--pers-navy); color:#fff">${sum}</th>
          </tr>
          <tr>
            <th class="r">% Ausentismo</th>
            ${tot.map(v => {
              if(!v) return '<td></td>';
              const p = v / N;
              const [bg, fg] = heat(p);
              return `<td style="background:${bg};color:${fg};font-weight:700">${Math.round(p*100)}%</td>`;
            }).join('')}
            <th></th>
          </tr>
        </tfoot>
      </table>
    </div>
    <div class="lg">
      <span><i style="background:#E6FAFF; border:1px solid #007799"></i>Bajo (&lt;${Math.round(S.u*.9)}%)</span>
      <span><i style="background:#FEF3C7; border:1px solid #92400E"></i>Cerca del Umbral</span>
      <span><i style="background:#FEE2E2; border:1px solid #B91C1C"></i>Alerta (&gt;${S.u}%)</span>
      <span>Haz clic en cualquier celda de la fila TOTAL TÉCNICOS para ver el detalle de la semana.</span>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; margin-top: 16px;">
    <div class="card" style="margin:0">
      <h3>Semanas con Mayor Salida</h3>
      <ol>${top}</ol>
    </div>
    ${det ? det : `<div class="card" style="margin:0; display:flex; flex-direction:column; justify-content:center; color:var(--pers-muted);">
      <h3 style="color:var(--pers-navy)">Detalle de Semana Seleccionada</h3>
      <p style="margin:0">Haz clic en la fila de <b>TOTAL TÉCNICOS</b> en la tabla para ver qué técnicos están de vacaciones en esa semana específica.</p>
    </div>`}
  </div>`;
}

/* --- VISTA: PLANILLA POR OFICINA --- */
function plan(){
  const W = wk(S.y), K = W.map(iso);
  const activeOffices = getFilteredOffices();
  const activeTechs = getFilteredTechs();

  if (F !== 'ALL' && !activeOffices.some(o => o.n === F)) {
    F = 'ALL';
  }

  const ts = (F === 'ALL') ? activeTechs : activeTechs.filter(t => t.o === F);
  const calcTs = (F === 'ALL') ? ts.filter(t => !isExcludedOffice(t.o)) : ts;
  const n = calcTs.length || 1;
  const c = K.map(k => calcTs.filter(t => t.w.includes(k)).length);

  return `
  <div class="tabs">
    <button class="${F==='ALL'?'on':''}" onclick="F='ALL';render()">🌐 TODAS LAS OFICINAS (${DIST==='ALL'?'TODOS LOS DISTRITOS':e(DIST)})</button>
    ${activeOffices.map(o=>`<button class="${o.n===F?'on':''}" onclick="F='${e(o.n)}';render()">${e(o.n)}</button>`).join('')}
  </div>

  <div class="card">
    <h3>
      <span>${F==='ALL' ? 'Vista General - ' + (DIST==='ALL'?'Todos los Distritos':'Distrito '+e(DIST)) : 'Oficina: '+e(F)} (${S.y})</span>
      <span style="font-size:12px; font-weight:400; color:var(--pers-muted)">Haz clic en cualquier celda para activar/desactivar la semana</span>
    </h3>

    <div class="wrap">
      <table class="hm">
        <thead>
          <tr>
            <th class="r" rowspan="2">Técnico / Dotación</th>
            ${mh(W)}
            <th class="m" rowspan="2">Semanas</th>
          </tr>
          <tr>${W.map(t=>`<th title="${lab(t)}">${fmt(t)}</th>`).join('')}</tr>
        </thead>
        <tbody>
          ${ts.map(t=>{
            const userWeeks = W.filter((_, idx) => t.w.includes(K[idx])).map(t => fmt(t));
            const distName = getTechDistrict(t);
            return `
            <tr class="pl">
              <th class="r">
                <div style="font-weight:700">${e(t.n)}</div>
                <span class="badge-off">${e(t.o)}</span>${DIST==='ALL' ? `<span class="badge-dist">${e(distName)}</span>` : ''}
                <div style="font-weight:400; font-size:10px; color:var(--pers-muted); margin-top:2px;">
                  ${userWeeks.length ? userWeeks.map(w => `<span class="wk-chip">${w}</span>`).join('') : 'Sin semanas programadas'}
                </div>
              </th>
              ${K.map((k,i)=>{
                const h=t.w.includes(k);
                return `<td class="${h?'x':''}" title="${e(t.n)} · Semana ${lab(W[i])}" onclick="tog(${t.id},'${k}')">${h?'✓':''}</td>`;
              }).join('')}
              <th style="background:#F1F5F9">${K.filter(k=>t.w.includes(k)).length}</th>
            </tr>`;
          }).join('') || '<tr><td colspan="55">No hay técnicos asignados en esta vista.</td></tr>'}
        </tbody>
        <tfoot>
          <tr>
            <th class="r">Técnicos de Vacaciones<small>${calcTs.length} total</small></th>
            ${c.map((v,i)=>cell(v, calcTs.length, `${v}/${calcTs.length} téc. · ${lab(W[i])}`, -1)).join('')}
            <th>${c.reduce((a,b)=>a+b,0)}</th>
          </tr>
          <tr>
            <th class="r">% Ausentismo</th>
            ${c.map(v => {
              if(!v) return '<td></td>';
              const p = v / n;
              const [bg, fg] = heat(p);
              return `<td style="background:${bg};color:${fg};font-weight:700">${Math.round(p*100)}%</td>`;
            }).join('')}
            <th></th>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>`;
}

/* --- VISTA: ABM TÉCNICOS, OFICINAS Y DISTRITOS --- */
function abm(){
  const ts = [...S.t].sort((a,b) => a.o.localeCompare(b.o) || a.n.localeCompare(b.n));
  const K = wk(S.y).map(iso);

  const distOpts = (sel) => S.d.map(d => `<option ${d===sel?'selected':''}>${e(d)}</option>`).join('');
  const offOpts = (sel) => S.o.map(o => `<option ${o.n===sel?'selected':''}>${e(o.n)} (${e(o.d)})</option>`).join('');

  return `
  <!-- ALTA DE TÉCNICO -->
  <div class="card">
    <h3>Alta de Nuevo Técnico</h3>
    <div class="f">
      <input id="nn" type="text" placeholder="APELLIDO, NOMBRE" style="width:280px">
      <label>Oficina:</label>
      <select id="no">${offOpts(S.o[0]?.n)}</select>
      <button class="btn" onclick="addT()">➕ Agregar Técnico</button>

  <!-- NOMINA DE TÉCNICOS -->
  <div class="card">

      <thead>
        <tr><th>Nombre Completo</th><th>Oficina / Distrito</th><th>Semanas ${S.y}</th><th>Semanas Programadas</th><th>Acción</th></tr>
      </thead>
      <tbody>
        ${ts.map(t=>{
          const assigned = wk(S.y).filter((_, idx) => t.w.includes(K[idx])).map(w => lab(w));
          return `
          <tr>
            <td><input type="text" value="${e(t.n)}" onchange="editT(${t.id},'n',this.value)"></td>
            <td>
              <select onchange="editT(${t.id},'o',this.value)">${offOpts(t.o)}</select>
            </td>
            <td><b>${K.filter(k=>t.w.includes(k)).length}</b> sem.</td>
            <td>${assigned.length ? assigned.map(a => `<span class="wk-chip">${a}</span>`).join(' ') : '<i>Ninguna</i>'}</td>
            <td><button class="del" onclick="delT(${t.id})">Eliminar</button></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>

  <!-- GESTIÓN DE DISTRITOS -->
  <div class="card">
    <h3>Gestión de Distritos</h3>
    ${S.d.map((d,i)=>`
      <div class="item-box">
        <input type="text" value="${e(d)}" onchange="renD(${i},this.value)">
        <span style="color:var(--pers-muted)">${S.o.filter(o=>o.d===d).length} oficinas asignadas</span>
        <button class="del" onclick="delD(${i})">Eliminar Distrito</button>
      </div>
    `).join('')}
    <div class="f" style="margin-top:14px">
      <input id="nd" type="text" placeholder="Nombre nuevo distrito (ej: Distrito Norte)">
      <button class="btn" onclick="addD()">➕ Agregar Distrito</button>
    </div>
  </div>

  <!-- GESTIÓN DE OFICINAS -->
  <div class="card">
    <h3>Gestión de Oficinas Técnicas</h3>
    ${S.o.map((o,i)=>`
      <div class="item-box">
        <input type="text" value="${e(o.n)}" onchange="renO(${i},this.value)" placeholder="Nombre Oficina">
        <label style="margin-left:10px">Distrito:</label>
        <select onchange="changeDistO(${i},this.value)">${distOpts(o.d)}</select>
        <span style="color:var(--pers-muted); margin-left:10px;">${S.t.filter(t=>t.o===o.n).length} técnicos</span>
        <button class="del" onclick="delO(${i})" style="margin-left:auto">Eliminar Oficina</button>
      </div>
    `).join('')}
    <div class="f" style="margin-top:14px">
      <input id="no2" type="text" placeholder="Nombre nueva oficina">
      <label>Asignar a Distrito:</label>
      <select id="nd2">${distOpts(S.d[0])}</select>
      <button class="btn" onclick="addO()">➕ Agregar Oficina</button>
    </div>
  </div>`;
}

      </thead>
      <tbody>
        ${S.users.map((u, idx) => `
          <tr>
            <td><b>${e(u.u)}</b>${u.u === currentUser.u ? '<span class="wk-chip">Tu sesión</span>' : ''}</td>
            <td>
              <input type="text" value="${e(u.p)}" placeholder="(Sin contraseña)" onchange="editUser(${idx},'p',this.value)" style="width:200px">
            </td>
            <td>
              <select onchange="editUser(${idx},'r',this.value)">
                <option value="user" ${u.r==='user'?'selected':''}>Usuario (User)</option>
                <option value="admin" ${u.r==='admin'?'selected':''}>Administrador (Admin)</option>
              </select>
            </td>
            <td>
              ${u.u === currentUser.u 
                ? '<i style="color:var(--pers-muted)">Sesión activa</i>' 
                : `<button class="del" onclick="delUser(${idx})">Eliminar</button>`
              }
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  </div>`;
}

function addUser() {
  const uVal = $('#nu-u').value.trim().toLowerCase();
  const pVal = $('#nu-p').value.trim();
  const rVal = $('#nu-r').value;

  if (!uVal) return alert('Debes ingresar un nombre de usuario.');
  if (S.users.some(x => x.u.toLowerCase() === uVal)) return alert('Ya existe un usuario con ese nombre.');

  S.users.push({ u: uVal, p: pVal, r: rVal });
  logAction(`Creó al usuario "${uVal}" con rol [${rVal}]`);
  markUnsaved();
  $('#nu-u').value = '';
  $('#nu-p').value = '';
  render();
}

function editUser(idx, field, value) {
  if (S.users[idx]) {
    const target = S.users[idx];
    if (field === 'p') {
      target.p = value.trim();
      logAction(`Cambió la contraseña del usuario "${target.u}"`);
    }
    if (field === 'r') {
      target.r = value;
      logAction(`Cambió el rol del usuario "${target.u}" a [${value}]`);
    }
    markUnsaved();
    render();
  }
}

function delUser(idx) {
  const target = S.users[idx];
  if (!target) return;
  if (target.u === currentUser.u) return alert('No podés eliminar tu propio usuario en uso.');

  if (confirm(`¿Eliminar al usuario "${target.u}"?`)) {
    S.users.splice(idx, 1);
    logAction(`Eliminó al usuario "${target.u}"`);
    markUnsaved();
    render();
  }
}

/* --- VISTA: LOG DE AUDITORÍA (SOLO ADMINS) --- */

  if (!currentUser || currentUser.r !== 'admin') {
    return `<div class="card"><p style="color:var(--danger)">⚠️ Acceso denegado. Solamente los administradores pueden ver el log de auditoría.</p></div>`;

    </div>

function clearLogs() {

  if (!t) return;
  const i = t.w.indexOf(k);

  const W = wk(S.y);
  const K = W.map(iso);
  const weekIndex = K.indexOf(k);
  const weekLabel = weekIndex >= 0 ? lab(W[weekIndex]) : k;

  if (i < 0) {
    if (!isExcludedOffice(t.o)) {
      const officeCount = S.t.filter(x => x.o === t.o && x.w.includes(k)).length;
      if (officeCount >= 2) {
        alert(`⚠️ Límite por Oficina Alcanzado:\nLa oficina "${t.o}" ya tiene 2 técnicos en vacaciones en esta semana.`);
        return;
      }

      const globalCount = S.t.filter(x => !isExcludedOffice(x.o) && getTechDistrict(x) === getTechDistrict(t) && x.w.includes(k)).length;
      if (globalCount >= 9) {
        alert(`⚠️ Límite General Alcanzado:\nSe ha alcanzado el cupo máximo de 9 técnicos simultáneos en vacaciones en el distrito para esta semana (excluyendo Supervisores y MS).`);

  render();

  logAction(`Creó el distrito "${n}"`);

function renD(i,v){

  const old=S.d[i];
  S.d[i]=v;
  S.o.forEach(o=>{ if(o.d===old) o.d=v; });

  logAction(`Renombró el distrito "${old}" a "${v}"`);
  markUnsaved();
  render();
}

function delD(i){

  if(S.d.length<=1) return alert('Debe existir al menos un distrito.');
  if(confirm(`¿Eliminar el distrito "${distName}"?`)){
    S.d.splice(i,1);
    if(DIST===distName) DIST='ALL';
    logAction(`Eliminó el distrito "${distName}"`);
    markUnsaved();
    render();
  }
}

}

    const bt=r.querySelector('button.del'),m=bt&&/delT\((\d+)\)/.exec(bt.getAttribute('onclick')),t=m&&S.t.find(x=>x.id==m[1]);if(!t)return;
    const b=bal(t,S.y),cell=h=>{const td=document.createElement('td');td.innerHTML=h;r.insertBefore(td,r.lastElementChild);};
    cell(`<input type="number" min="0" style="width:90px" placeholder="–" value="${b?b.p:''}" onchange="setBal(${t.id},'p',this.value)">`);
    cell(`<input type="number" min="0" style="width:90px" placeholder="–" value="${b?b.l:''}" onchange="setBal(${t.id},'l',this.value)">`);
    cell(b?`Ant. <b>${b.rp}</b> · Lic. <b class="${b.rl<0?'neg':''}">${b.rl}</b>`:'<span class="mut">Sin cargar</span>');
  });
  const n=document.createElement('p');n.className='bal-note';n.textContent='Saldos en días para el año '+S.y+' (cada semana descuenta 7 días, primero de año anterior). Cambiá el año arriba para cargar otro período.';
  tb.parentNode.insertBefore(n,tb);
}

/* matriz: clic en oficina -> planilla de carga de esa oficina */
function linkOffices(){
  document.querySelectorAll('.hm tbody tr').forEach(r=>{
    const th=r.querySelector('th.r');if(!th||!th.firstChild)return;
    const nm=(th.firstChild.nodeValue||'').trim(),o=S.o.find(x=>x.n===nm);if(!o)return;
    th.classList.add('go');th.title='Abrir planilla de carga de '+nm;
    th.onclick=()=>{DIST=o.d;F=nm;V='p';SEL=null;render();};
  });
}

/* resumen de vacaciones: tomadas / programadas / pendientes */
function vs(ts){
  const y=S.y,W=wk(y),now=Date.now();let tk=0,sc=0,pd=0,tot=0,sin=0;
  ts.forEach(t=>{
    W.filter(w=>t.w.includes(iso(w))).forEach(w=>{if(w+6*864e5<now)tk++;else sc++;});
    const b=bal(t,y);if(b){tot+=b.p+b.l;pd+=Math.max(0,b.rp+b.rl);}else sin++;
  });
  return{tk,sc,pd,tot,sin};
}

/* gestión: técnicos / oficinas / distritos con pestañas */
let ABT='t',TF='',TQ='';
window.filtRows=q=>{
  TQ=q;const s=q.trim().toLowerCase();let g=null,v=0;
  document.querySelectorAll('.abm-t tbody tr').forEach(r=>{
    if(r.classList.contains('grp')){if(g)g.style.display=v?'':'none';g=r;v=0;return;}
    r.style.display=!s||(r.dataset.n||'').includes(s)?'':'none';if(r.style.display!=='none')v++;
  });
  if(g)g.style.display=v?'':'none';
};
window.toggleAdd=()=>{const b=document.querySelector('.addbox');if(!b)return;b.classList.toggle('open');const i=b.querySelector('input');if(i)i.focus();};
function abm2(){
  const offIdx=n=>{const i=S.o.findIndex(o=>o.n===n);return i<0?99:i;};
  const cnt={t:S.t.length,o:S.o.length,d:S.d.length};
  const tabs=`<div class="tabs">${[['t','Técnicos'],['o','Oficinas'],['d','Distritos']].map(([k,l])=>`<button class="${ABT===k?'on':''}" onclick="ABT='${k}';render()">${l} <span class="cnt">${cnt[k]}</span></button>`).join('')}</div>`;
  const distOpts=sel=>S.d.map(d=>`<option ${d===sel?'selected':''}>${e(d)}</option>`).join('');
  const offOpts=sel=>S.o.map(o=>`<option ${o.n===sel?'selected':''}>${e(o.n)} (${e(o.d)})</option>`).join('');
  let body='';
  if(ABT==='t'){
    const K=wk(S.y).map(iso);
    const list=[...S.t].filter(t=>!TF||t.o===TF).sort((a,b)=>offIdx(a.o)-offIdx(b.o)||a.n.localeCompare(b.n,'es'));
    let last=null,rows='';
    list.forEach(t=>{
      if(t.o!==last){last=t.o;rows+=`<tr class="grp"><td colspan="7">${e(t.o)} <span class="cnt">${list.filter(x=>x.o===t.o).length}</span></td></tr>`;}
      const b=bal(t,S.y),wn=K.filter(k=>t.w.includes(k)).length;
      rows+=`<tr data-n="${e(t.n.toLowerCase())}"><td><input type="text" value="${e(t.n)}" onchange="editT(${t.id},'n',this.value)"></td><td><select onchange="editT(${t.id},'o',this.value)">${offOpts(t.o)}</select></td><td class="c"><input class="num" type="number" min="0" placeholder="–" value="${b?b.p:''}" onchange="setBal(${t.id},'p',this.value)"></td><td class="c"><input class="num" type="number" min="0" placeholder="–" value="${b?b.l:''}" onchange="setBal(${t.id},'l',this.value)"></td><td class="c">${b?`<b>${b.rp}</b> / <b class="${b.rl<0?'neg':''}">${b.rl}</b>`:'<span class="mut">–</span>'}</td><td class="c">${wn}</td><td class="c"><button class="del" onclick="delT(${t.id})">Eliminar</button></td></tr>`;
    });
    body=`<div class="abm-bar"><input type="search" placeholder="Buscar técnico" value="${e(TQ)}" oninput="filtRows(this.value)"><select onchange="TF=this.value;render()"><option value="">Todas las oficinas</option>${S.o.map(o=>`<option ${o.n===TF?'selected':''}>${e(o.n)}</option>`).join('')}</select><span class="sp"></span><span class="mut">Saldos de ${S.y} en días</span><button class="btn" onclick="toggleAdd()">+ Nuevo técnico</button></div>
    <div class="addbox"><input id="nn" type="text" placeholder="APELLIDO, NOMBRE"><select id="no">${offOpts(S.o[0]&&S.o[0].n)}</select><button class="btn" onclick="addT()">Agregar técnico</button></div>
    <div class="abm-wrap"><table class="abm-t"><thead><tr><th>Nombre</th><th>Oficina</th><th class="c">Vacaciones año anterior</th><th class="c">Licencia por vacaciones</th><th class="c">Saldo (ant. / lic.)</th><th class="c">Sem.</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="mut" style="padding:16px">No hay técnicos.</td></tr>'}</tbody></table></div>`;
  }else if(ABT==='o'){
    body=`<div class="abm-bar"><span class="mut">${S.o.length} oficinas</span><span class="sp"></span><button class="btn" onclick="toggleAdd()">+ Nueva oficina</button></div>
    <div class="addbox"><input id="no2" type="text" placeholder="Nombre de la oficina"><select id="nd2">${distOpts(S.d[0])}</select><button class="btn" onclick="addO()">Agregar oficina</button></div>
    <div class="abm-wrap"><table class="abm-t"><thead><tr><th>Oficina</th><th>Distrito</th><th class="c">Técnicos</th><th></th></tr></thead><tbody>${S.o.map((o,i)=>`<tr><td><input type="text" value="${e(o.n)}" onchange="renO(${i},this.value)"></td><td><select onchange="changeDistO(${i},this.value)">${distOpts(o.d)}</select></td><td class="c">${S.t.filter(t=>t.o===o.n).length}</td><td class="c"><button class="del" onclick="delO(${i})">Eliminar</button></td></tr>`).join('')}</tbody></table></div>`;
  }else{
    body=`<div class="abm-bar"><span class="mut">${S.d.length} distritos</span><span class="sp"></span><button class="btn" onclick="toggleAdd()">+ Nuevo distrito</button></div>
    <div class="addbox"><input id="nd" type="text" placeholder="Nombre del distrito"><button class="btn" onclick="addD()">Agregar distrito</button></div>
    <div class="abm-wrap"><table class="abm-t"><thead><tr><th>Distrito</th><th class="c">Oficinas</th><th class="c">Técnicos</th><th></th></tr></thead><tbody>${S.d.map((d,i)=>`<tr><td><input type="text" value="${e(d)}" onchange="renD(${i},this.value)"></td><td class="c">${S.o.filter(o=>o.d===d).length}</td><td class="c">${S.t.filter(t=>getTechDistrict(t)===d).length}</td><td class="c"><button class="del" onclick="delD(${i})">Eliminar</button></td></tr>`).join('')}</tbody></table></div>`;
  }
  return tabs+body;
}
abm=abm2;

/* programación automática (solo administradores) */
const as=document.createElement('div');as.id='as-modal';
as.innerHTML=`<div class="as-box"><h3>Programación automática</h3><p>Asigna al azar las vacaciones pendientes de cada técnico, respetando lo ya cargado y los límites de 2 por oficina y 9 por distrito.</p><label>Oficinas</label><select id="as-sc"></select><div class="as-r"><div><label>Desde la semana</label><select id="as-f"></select></div><div><label>Hasta la semana</label><select id="as-t"></select></div></div><div class="ct-act" style="justify-content:flex-end;margin-top:18px"><button onclick="document.getElementById('as-modal').classList.remove('open')">Cancelar</button><button class="btn" onclick="runAuto()">Generar</button></div></div>`;
document.body.appendChild(as);
window.openAuto=function(){
  if(!currentUser||currentUser.r!=='admin')return;
  const W=wk(S.y),now=Date.now(),offs=getFilteredOffices();
  let f=W.findIndex(w=>w+6*864e5>=now);if(f<0)f=0;
  document.getElementById('as-sc').innerHTML='<option value="">Todas las oficinas'+(DIST==='ALL'?'':' · '+e(DIST))+'</option>'+offs.map(o=>`<option ${o.n===F?'selected':''}>${e(o.n)}</option>`).join('');
  const opts=sel=>W.map((w,i)=>`<option value="${i}" ${i===sel?'selected':''}>${lab(w)}</option>`).join('');
  document.getElementById('as-f').innerHTML=opts(f);
  document.getElementById('as-t').innerHTML=opts(W.length-1);
  as.classList.add('open');
};
window.runAuto=function(){
  if(!currentUser||currentUser.r!=='admin')return alert('Solo los administradores pueden usar la programación automática.');
  const W=wk(S.y),K=W.map(iso),f=+document.getElementById('as-f').value,t2=+document.getElementById('as-t').value,sc=document.getElementById('as-sc').value;
  if(f>t2)return alert('El rango de semanas no es válido.');
  const scope=getFilteredTechs().filter(t=>!sc||t.o===sc);
  const cOff={},cDist={};
  S.t.forEach(t=>{if(isExcludedOffice(t.o))return;const d=getTechDistrict(t);K.forEach((k,i)=>{if(t.w.includes(k)){cOff[t.o+'|'+i]=(cOff[t.o+'|'+i]||0)+1;cDist[d+'|'+i]=(cDist[d+'|'+i]||0)+1;}});});
  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  const need=new Map();let skipped=0;
  scope.forEach(t=>{const b=bal(t,S.y);if(!b){skipped++;return;}const n=Math.floor(Math.max(0,b.rp+b.rl)/7);if(n>0)need.set(t,n);});
  const got=new Map(),techs=[...need.keys()],maxN=Math.max(0,...need.values());
  for(let r=0;r<maxN;r++){
    shuffle(techs.slice()).forEach(t=>{
      const mine=got.get(t)||[];if(mine.length>=need.get(t))return;
      const ex=isExcludedOffice(t.o),d=getTechDistrict(t);
      const cand=shuffle(K.map((_,i)=>i).filter(i=>i>=f&&i<=t2&&!t.w.includes(K[i])&&!mine.includes(i)&&(ex||((cOff[t.o+'|'+i]||0)<2&&(cDist[d+'|'+i]||0)<9))));
      if(!cand.length)return;
      const i=cand[0];mine.push(i);got.set(t,mine);
      if(!ex){cOff[t.o+'|'+i]=(cOff[t.o+'|'+i]||0)+1;cDist[d+'|'+i]=(cDist[d+'|'+i]||0)+1;}
    });
  }
  let total=0,missing=0;got.forEach(a=>total+=a.length);need.forEach((n,t)=>missing+=n-(got.get(t)||[]).length);
  if(!total)return alert('No hay semanas para asignar: los técnicos del alcance elegido no tienen saldo pendiente cargado, o no hay lugar en ese rango por los límites.');
  const msg='Programación automática '+S.y+'\n\n• Técnicos con pendientes: '+need.size+'\n• Semanas a asignar: '+total+'\n'+(missing?'• Sin lugar por los límites: '+missing+' (probá con un rango más amplio)\n':'')+(skipped?'• Omitidos por no tener saldo cargado: '+skipped+'\n':'')+'\nSe respetan los límites de 2 por oficina y 9 por distrito.\n¿Aplicar la programación?';
  if(!confirm(msg))return;
  got.forEach((arr,t)=>{arr.forEach(i=>t.w.push(K[i]));t.w.sort();});
  logAction('Programación automática: '+total+' semanas asignadas a '+need.size+' técnicos (rango '+lab(W[f])+' a '+lab(W[t2])+')');
  markUnsaved();as.classList.remove('open');render();
};

/* ---------- Hooks ---------- */
const _render=render;let lv=null,savedAll=false;
render=function(){
  if(V==='p'&&DIST==='ALL'&&S.d&&S.d.length){savedAll=true;DIST=S.d[0];F='ALL';}
  else if(V!=='p'&&savedAll){DIST='ALL';savedAll=false;}
  _render();
  const first=V!==lv;lv=V;
  if(V==='p'){planBar();applyPQ();fillCounts();}
  markCur();
  if(V==='d')linkOffices();
  if(V==='a'&&ABT==='t'&&TQ)filtRows(TQ);
  const adm=currentUser&&currentUser.r==='admin';
  sb.querySelector('.adm').style.display=adm?'':'none';
  sb.querySelectorAll('.nav-i').forEach(b=>b.classList.toggle('on',b.dataset.nv===V));
  ttl.textContent=(TT[V]||'')+' · '+S.y;
  if(currentUser){document.getElementById('sb-user').textContent=currentUser.u;document.getElementById('sb-role').textContent=adm?'Administrador':'Usuario';}
  clean(document.body);
  if(first&&V==='p')setTimeout(goToday,60);
};
const _sa=showAppUI;showAppUI=function(){document.body.classList.add('in-app');_sa();};
const _sl=showLoginUI;showLoginUI=function(){document.body.classList.remove('in-app');_sl();};
})();

</script>
