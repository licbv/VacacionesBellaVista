<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión de Vacaciones - Movistar Distrito</title>
<style>
:root {
  --mov-navy: #003245;
  --mov-blue: #019DF4;
  --mov-green: #5CB615;
  --mov-green-bg: #EBF7E5;
  --mov-bg: #F4F6F8;
  --mov-card: #FFFFFF;
  --mov-text: #1D252C;
  --mov-muted: #50535A;
  --mov-border: #D0D7DE;
  --danger: #E53935;
  --warning: #FF9800;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: 'Telefonica', 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--mov-bg); color: var(--mov-text); font-size: 13px; }

/* Header Movistar */
header { background: var(--mov-navy); color: #fff; padding: 12px 20px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
.brand { display: flex; align-items: center; gap: 10px; margin-right: 15px; }
.brand-logo { background: var(--mov-green); color: #fff; font-weight: 900; font-size: 18px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
h1 { font-size: 18px; margin: 0; font-weight: 700; letter-spacing: -0.3px; }

/* Botones & Controls */
button, select, input { font-family: inherit; font-size: 12px; border: 1px solid var(--mov-border); border-radius: 20px; padding: 6px 14px; transition: all .15s ease; }
button { cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
header button { background: rgba(255,255,255,0.12); color: #fff; border: 1px solid rgba(255,255,255,0.25); }
header button:hover { background: rgba(255,255,255,0.25); }
header button.on { background: var(--mov-blue); color: #fff; border-color: var(--mov-blue); box-shadow: 0 2px 6px rgba(1,157,244,0.4); }
header select, header input { background: #fff; color: var(--mov-navy); font-weight: 600; }
header input { width: 60px; text-align: center; }
header label { font-size: 12px; opacity: 0.9; }
.sp { flex: 1; }

/* Dashboard & Cards */
main { padding: 20px; max-width: 1600px; margin: 0 auto; }
.card { background: var(--mov-card); border-radius: 12px; padding: 18px; margin-bottom: 16px; border: 1px solid var(--mov-border); box-shadow: 0 2px 6px rgba(0,0,0,0.03); }
h3 { margin: 0 0 14px; font-size: 15px; color: var(--mov-navy); font-weight: 700; display: flex; align-items: center; justify-content: space-between; }

/* KPIs Distrito */
.kp { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 18px; }
.kp .card { margin: 0; border-left: 5px solid var(--mov-blue); }
.kp.district .card { border-left-color: var(--mov-green); background: #fafefe; }
.kp b { display: block; font-size: 24px; color: var(--mov-navy); font-weight: 800; line-height: 1.2; }
.kp span { color: var(--mov-muted); font-size: 12px; font-weight: 500; }

.two { display: grid; grid-template-columns: 1fr 320px; gap: 16px; }
@media (max-width: 1100px) { .two { grid-template-columns: 1fr; } }

/* Tabla Heatmap */
.wrap { overflow: auto; max-height: 70vh; border-radius: 8px; border: 1px solid var(--mov-border); }
table { border-collapse: separate; border-spacing: 0; width: 100%; }
.hm td, .hm th { border-right: 1px solid #e2e8f0; border-bottom: 1px solid #e2e8f0; text-align: center; font-size: 11px; min-width: 34px; height: 32px; padding: 0 3px; }
.hm td { cursor: pointer; transition: filter .1s; }
.hm td.sel { outline: 2px solid var(--mov-navy); outline-offset: -2px; }
.hm td:hover { filter: brightness(0.92); }
.hm th { background: #EBF3F8; color: var(--mov-navy); font-weight: 700; position: sticky; top: 0; z-index: 1; }
.hm thead tr+tr th { top: 32px; }
.hm th.m { background: var(--mov-navy); color: #fff; }
.hm th.r { position: sticky; left: 0; z-index: 2; text-align: left; min-width: 210px; padding: 0 10px; background: #F0F5F9; font-weight: 600; color: var(--mov-navy); }
.hm th.r small { float: right; color: var(--mov-muted); font-weight: 400; }
.hm thead th.r { top: 0; z-index: 3; background: var(--mov-navy); color: #fff; }
.hm tfoot th, .hm tfoot td { font-weight: 800; background: #E2ECF5; }
.hm tfoot tr.district-total th, .hm tfoot tr.district-total td { background: var(--mov-navy); color: #fff; border-top: 2px solid var(--mov-blue); }

/* Celda Verde Vacaciones Movistar */
.x { background: var(--mov-green) !important; color: #fff !important; font-weight: 800; font-size: 12px; }
.pl td { background: #fff; }
.pl tr:nth-child(even) td { background: #fafafa; }

/* Badges & Chips */
.wk-chip { display: inline-block; background: var(--mov-green-bg); color: #2E6A05; border: 1px solid #b7e4a1; border-radius: 12px; padding: 2px 8px; font-size: 10px; font-weight: 700; margin: 2px; }
.badge-off { background: #E0F2FE; color: #0369A1; padding: 2px 7px; border-radius: 10px; font-size: 10px; font-weight: 600; }

/* Leyenda */
.lg { display: flex; gap: 16px; font-size: 11px; margin: 12px 0 0; align-items: center; flex-wrap: wrap; color: var(--mov-muted); }
.lg i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -3px; margin-right: 4px; }

/* Tabs */
.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.tabs button { background: #fff; border: 1px solid var(--mov-border); color: var(--mov-navy); border-radius: 20px; padding: 6px 16px; }
.tabs button.on { background: var(--mov-navy); color: #fff; border-color: var(--mov-navy); box-shadow: 0 2px 5px rgba(0,50,69,0.3); }

/* Form & ABM */
.btn { background: var(--mov-blue); color: #fff; border: 0; }
.btn:hover { background: #0088d4; }
.del { background: #FEE2E2; color: var(--danger); border: 1px solid #fca5a5; }
.del:hover { background: #fca5a5; }
.f { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
input[type=text], select { border: 1px solid var(--mov-border); background: #fff; padding: 6px 12px; border-radius: 8px; }
.tb { width: 100%; border-collapse: collapse; }
.tb th { text-align: left; color: var(--mov-muted); font-weight: 700; padding: 8px; border-bottom: 2px solid var(--mov-border); }
.tb td { padding: 8px; border-bottom: 1px solid #eef2f7; vertical-align: middle; }
.tb input { width: 100%; }
.of { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; background: #f8fafc; padding: 8px 12px; border-radius: 8px; }

.tech-detail { background: #f0fdf4; border: 1px solid #bbf7d0; padding: 12px; border-radius: 8px; margin-top: 10px; }
ol { margin: 0; padding-left: 18px; }
li { padding: 6px 0; border-bottom: 1px solid #f1f5f9; cursor: pointer; }
li:hover { color: var(--mov-blue); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-logo">m</div>
    <h1>Vacaciones Técnicos · Movistar</h1>
  </div>
  <button data-v="d" onclick="V='d';render()">📊 Resumen Distrito</button>
  <button data-v="p" onclick="V='p';render()">📅 Planilla por Oficina</button>
  <button data-v="a" onclick="V='a';render()">⚙️ Gestión Técnicos y Oficinas</button>
  
  <span class="sp"></span>
  
  <label>Año</label>
  <select id="ys" onchange="S.y=+this.value;SEL=null;save();render()"></select>
  
  <label>Umbral Alerta %</label>
  <input id="u" type="number" min="1" max="100" onchange="S.u=+this.value||20;save();render()">
  
  <button onclick="csv()">📥 Exportar CSV</button>
  <button onclick="dl('vacaciones-movistar.json',JSON.stringify(S),'application/json')">💾 Copia JSON</button>
  <button onclick="$('#fi').click()">📂 Cargar Backup</button>
  <input id="fi" type="file" accept=".json" hidden onchange="imp(this)">
</header>

<main id="app"></main>

<script>
const SEED={"o": ["Bella Vista", "Hurlingham", "Jose C Paz", "Los Polvorines", "San Miguel", "Trujui", "Pilar"], "t": [{"id": 1, "n": "AVELLANEDA, PABLO SEBASTIAN", "o": "Bella Vista", "w": []}, {"id": 2, "n": "BELMONTE, JAVIER LEANDRO", "o": "Bella Vista", "w": []}, {"id": 3, "n": "CABRAL, CARLOS EZEQUIEL", "o": "Bella Vista", "w": ["2026-07-20"]}, {"id": 4, "n": "RIVAROLA, RUBEN ALBERTO", "o": "Hurlingham", "w": ["2026-04-06", "2026-04-13"]}, {"id": 5, "n": "CUENCA, LUIS DAVID", "o": "Hurlingham", "w": ["2026-07-20", "2026-08-24"]}, {"id": 6, "n": "ESPOSITO, MATIAS ALEJANDRO", "o": "Hurlingham", "w": ["2026-05-18", "2026-07-13"]}, {"id": 7, "n": "FARIÑA, MATIAS", "o": "Hurlingham", "w": ["2026-04-13", "2026-04-20", "2026-06-15", "2026-08-31"]}, {"id": 8, "n": "SARRA, CRISTIAN DAMIAN", "o": "Hurlingham", "w": ["2026-07-27"]}, {"id": 9, "n": "GALEANO, MAURICIO RAUL", "o": "Hurlingham", "w": ["2026-04-13", "2026-05-25", "2026-07-27"]}, {"id": 10, "n": "DIAZ, ROBERTO MARTIN", "o": "Jose C Paz", "w": ["2026-04-06", "2026-04-13"]}, {"id": 11, "n": "DRAGHI, LUCIANO MARTIN", "o": "Jose C Paz", "w": []}, {"id": 12, "n": "KRUPPA, ADRIAN MAXIMILIANO", "o": "Jose C Paz", "w": ["2026-12-21"]}, {"id": 13, "n": "LARROSA, GONZALO EZEQUIEL", "o": "Jose C Paz", "w": []}, {"id": 14, "n": "BENITEZ, MIGUEL", "o": "Jose C Paz", "w": []}, {"id": 15, "n": "CREVATIN, ALEX LEONEL", "o": "Jose C Paz", "w": []}, {"id": 16, "n": "D´AURIA, ENZO ALEJANDRO", "o": "Jose C Paz", "w": []}, {"id": 17, "n": "CAROSIO, SEBASTIAN", "o": "Jose C Paz", "w": []}, {"id": 18, "n": "NACHAR, CARLOS", "o": "Los Polvorines", "w": []}, {"id": 19, "n": "STIBEL MARIO", "o": "Los Polvorines", "w": []}, {"id": 20, "n": "SERRANO GERMAN", "o": "Los Polvorines", "w": []}, {"id": 21, "n": "PAGANELLI, ARIEL HERNAN", "o": "Los Polvorines", "w": []}, {"id": 22, "n": "NOVO, RODRIGO EZEQUIEL", "o": "Los Polvorines", "w": []}, {"id": 23, "n": "MAIDANA, LUIS HORACIO", "o": "Los Polvorines", "w": ["2026-04-06"]}, {"id": 24, "n": "ESVER, RAUL ISAAC", "o": "San Miguel", "w": ["2026-04-06", "2026-09-28"]}, {"id": 25, "n": "VAZQUEZ, ANDRES GABRIEL", "o": "San Miguel", "w": ["2026-08-24"]}, {"id": 26, "n": "GALARZA, JORGE LUIS", "o": "San Miguel", "w": ["2026-05-18", "2026-06-15", "2026-10-19"]}, {"id": 27, "n": "PALACIOS, MAURICIO", "o": "San Miguel", "w": ["2026-04-13", "2026-07-20", "2026-09-21"]}, {"id": 28, "n": "ACOSTA, GUSTAVO ALEJANDRO", "o": "San Miguel", "w": ["2026-08-03", "2026-08-10", "2026-08-17"]}, {"id": 29, "n": "MEDINA, CLAUDIO ANDRES", "o": "San Miguel", "w": ["2026-06-08"]}, {"id": 30, "n": "TORRES, LEONARDO DANIEL", "o": "San Miguel", "w": ["2026-10-05"]}, {"id": 31, "n": "PEREZ, FERNANDO GABRIEL", "o": "San Miguel", "w": ["2026-03-23", "2026-03-30", "2026-05-25", "2026-07-27"]}, {"id": 32, "n": "PAREDES, DIEGO NICASIO", "o": "Trujui", "w": ["2026-04-06", "2026-08-17"]}, {"id": 33, "n": "CAMIÑA, HORACIO", "o": "Trujui", "w": []}, {"id": 34, "n": "PIRELLO, JULIO", "o": "Trujui", "w": []}, {"id": 35, "n": "LESSERTESEUR, PABLO", "o": "Trujui", "w": []}, {"id": 36, "n": "ALVAREZ, MATIAS", "o": "Trujui", "w": []}, {"id": 37, "n": "VEISAGA, CARLOS MARTIN", "o": "Trujui", "w": []}, {"id": 38, "n": "COMPTA, DIEGO CRISTIAN JORGE", "o": "Trujui", "w": []}, {"id": 39, "n": "LASSALLE, PABLO", "o": "Pilar", "w": ["2026-06-01", "2026-06-08", "2026-09-14"]}, {"id": 40, "n": "RAGES, MARCELO OMAR", "o": "Pilar", "w": ["2026-04-06", "2026-04-13", "2026-08-10"]}, {"id": 41, "n": "MAIDANA, FACUNDO EMILIANO", "o": "Pilar", "w": ["2026-05-04", "2026-05-11", "2026-09-21", "2026-09-28"]}, {"id": 42, "n": "ANRIQUEZ, JAIRO", "o": "Pilar", "w": ["2026-10-12"]}, {"id": 43, "n": "SERRANO, FELIPE", "o": "Pilar", "w": ["2026-06-15", "2026-07-13", "2026-07-20"]}, {"id": 44, "n": "VAZQUEZ, MARTIN ALEJANDRO", "o": "Pilar", "w": ["2026-05-25", "2026-06-15", "2026-10-26", "2026-11-02"]}, {"id": 45, "n": "PAGANELLI, ARIEL HERNAN", "o": "Pilar", "w": ["2026-07-27", "2026-08-03"]}]};

const $=s=>document.querySelector(s), MES=['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
const e=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

function load(){ try { return JSON.parse(localStorage.getItem('vac_movistar')); } catch(x){ return null; } }
function save(){ try { localStorage.setItem('vac_movistar', JSON.stringify(S)); } catch(x){ alert('Error al guardar datos: '+x.message); } }

let S=load();
if(!S || !S.t){ S={u:20, y:2026, o:SEED.o, t:SEED.t}; save(); }

let V='d', F='ALL', SEL=null, nid=Math.max(0,...S.t.map(t=>t.id));

const wk=y=>{ let d=Date.UTC(y,0,1); while(new Date(d).getUTCDay()!=1) d+=864e5; return [...Array(52)].map((_,i)=>d+i*6048e5); };
const iso=t=>new Date(t).toISOString().slice(0,10), p2=n=>String(n).padStart(2,'0');
const fmt=t=>{ const d=new Date(t); return p2(d.getUTCDate())+'/'+p2(d.getUTCMonth()+1); };
const lab=t=>fmt(t)+' – '+fmt(t+6*864e5);

const mh=W=>{
  let h='', i=0;
  while(i<W.length){
    const m=new Date(W[i]).getUTCMonth(); let j=i;
    while(j<W.length && new Date(W[j]).getUTCMonth()==m) j++;
    h+=`<th colspan=${j-i} class=m>${MES[m]}</th>`; i=j;
  }
  return h;
};

const heat=(p)=>{
  const u=S.u/100;
  if(p<=0) return ['#F4F6F8','#64748b'];
  if(p<.9*u) return ['#EBF7E5','#2E6A05'];
  if(p<=u) return ['#FFF3C4','#9A6700'];
  return ['#FEE2E2','#B91C1C'];
};

const cell=(c,n,tt,i,isDistrict=false)=>{
  const p=n?c/n:0, [bg,fg]=heat(p);
  const extraClass = isDistrict ? 'font-weight:bold;' : '';
  return `<td style="background:${bg};color:${fg};${extraClass}" title="${e(tt)}" class="${SEL==i?'sel':''}" ${i>=0?`onclick="SEL=${i};render()"`:''}>${c||''}</td>`;
};

const opts=(sel)=>S.o.map(o=>`<option ${o==sel?'selected':''}>${e(o)}</option>`).join('');

/* --- VISTA: DASHBOARD / RESUMEN DISTRITO --- */
function dash(){
  const W=wk(S.y), K=W.map(iso), N=S.t.length||1, u=S.u/100;
  const R=S.o.map(o=>{
    const ts=S.t.filter(t=>t.o==o);
    return {o, n:ts.length, c:K.map(k=>ts.filter(t=>t.w.includes(k)).length)};
  });
  
  const tot=K.map((_,i)=>R.reduce((a,r)=>a+r.c[i],0));
  const mx=Math.max(...tot), pk=tot.indexOf(mx), sum=tot.reduce((a,b)=>a+b,0);
  const over=tot.filter(x=>x/N>u).length;
  
  const top=tot.map((c,i)=>[c,i]).filter(x=>x[0]).sort((a,b)=>b[0]-a[0]).slice(0,6)
    .map(([c,i])=>`<li onclick="SEL=${i};render()"><b>Semana del ${lab(W[i])}</b><br><span style="color:var(--mov-blue);font-weight:700">${c} técnicos</span> (${Math.round(c/N*100)}% del distrito)</li>`).join('')
    || '<li>Sin vacaciones programadas en este año.</li>';

  const det=SEL==null?'':`<div class="card tech-detail"><h3>Detalle Semana ${lab(W[SEL])} (Distrito Completo)</h3>${
    S.o.map(o=>{
      const n=S.t.filter(t=>t.o==o && t.w.includes(K[SEL]));
      return n.length ? `<p style="margin:4px 0"><b>${e(o)}</b> (${n.length}):${n.map(t=>`<span class="wk-chip">${e(t.n)}</span>`).join(' ')}</p>` : '';
    }).join('') || '<p>Sin personal de vacaciones esta semana.</p>'
  }</div>`;

  return `
  <div class="card" style="background: linear-gradient(135deg, #003245 0%, #019DF4 100%); color:#fff;">
    <h2 style="margin:0 0 6px; font-size:20px; font-weight:800;">Resumen General del Distrito (${S.y})</h2>
    <p style="margin:0; opacity:0.9;">Monitoreo consolidado de dotación y cupos de vacaciones por oficina técnica.</p>
  </div>

  <div class="kp district">
    <div class="card"><b>${S.t.length}</b><span>Técnicos Totales Distrito</span></div>
    <div class="card"><b>${S.o.length}</b><span>Oficinas Técnicas</span></div>
    <div class="card"><b>${sum}</b><span>Semanas Asignadas (${S.y})</span></div>
    <div class="card"><b>${mx?Math.round(mx/N*100)+'%':'-'}</b><span>Pico Max: ${mx} téc. (${pk>=0?fmt(W[pk]):''})</span></div>
    <div class="card" style="border-left-color:${over? 'var(--danger)': 'var(--mov-green)'}"><b>${over}</b><span>Semanas s/ umbral (${S.u}%)</span></div>
  </div>

  <div class="two">
    <div class="card">
      <h3>Matriz de Ausentismo por Oficina y Semana (${S.y})</h3>
      <div class="wrap">
        <table class="hm">
          <thead>
            <tr><th class="r" rowspan="2">Oficina / Distrito</th>${mh(W)}<th class="m" rowspan="2">Σ Total</th></tr>
            <tr>${W.map(t=>`<th title="${lab(t)}">${fmt(t)}</th>`).join('')}</tr>
          </thead>
          <tbody>
            ${R.map(r=>`
              <tr>
                <th class="r">${e(r.o)} <small>${r.n} téc.</small></th>
                ${r.c.map((c,i)=>cell(c, r.n, `${r.o}: ${c}/${r.n} téc. (${r.n?Math.round(c/r.n*100):0}%) · ${lab(W[i])}`, -1)).join('')}
                <th>${r.c.reduce((a,b)=>a+b,0)}</th>
              </tr>
            `).join('')}
          </tbody>
          <tfoot>
            <tr class="district-total">
              <th class="r" style="background:var(--mov-navy); color:#fff">TOTAL DISTRITO <small style="color:#b0c4de">${S.t.length}</small></th>
              ${tot.map((c,i)=>cell(c, N, `Total Distrito: ${c}/${N} (${Math.round(c/N*100)}\%) ·${lab(W[i])}`, i, true)).join('')}
              <th style="background:var(--mov-navy); color:#fff">${sum}</th>
            </tr>
          </tfoot>
        </table>
      </div>
      <div class="lg">
        <span><i style="background:#EBF7E5; border:1px solid #2E6A05"></i>Bajo (&lt;${Math.round(S.u*.9)}%)</span>
        <span><i style="background:#FFF3C4; border:1px solid #9A6700"></i>Cerca del Umbral</span>
        <span><i style="background:#FEE2E2; border:1px solid #B91C1C"></i>Alerta (&gt;${S.u}%)</span>
        <span>Haz clic en la fila "TOTAL DISTRITO" para ver el detalle del personal de esa semana.</span>
      </div>
    </div>

    <div>
      <div class="card">
        <h3>Semanas con Mayor Salida</h3>
        <ol>${top}</ol>
      </div>
      ${det}
    </div>
  </div>`;
}

/* --- VISTA: PLANILLA POR OFICINA / DISTRITO COMPLETO --- */
function plan(){
  const W=wk(S.y), K=W.map(iso);
  const isAll = (F === 'ALL');
  
  const ts = isAll ? S.t : S.t.filter(t=>t.o==F);
  const n = ts.length || 1;
  const c = K.map(k=>ts.filter(t=>t.w.includes(k)).length);

  return `
  <div class="tabs">
    <button class="${F=='ALL'?'on':''}" onclick="F='ALL';render()">🌐 TODAS LAS OFICINAS (DISTRITO COMPLETO)</button>
    ${S.o.map((o,i)=>`<button class="${o==F?'on':''}" onclick="F=S.o[${i}];render()">${e(o)}</button>`).join('')}
  </div>

  <div class="card">
    <h3>
      <span>${isAll ? 'Vista General - Distrito Completo' : 'Oficina: '+e(F)} (${S.y})</span>
      <span style="font-size:12px; font-weight:400; color:var(--mov-muted)">Haz clic en cualquier celda para activar/desactivar la semana de vacaciones</span>
    </h3>

    <div class="wrap">
      <table class="hm">
        <thead>
          <tr>
            <th class="r" rowspan="2">Técnico / Dotación</th>
            ${mh(W)}
            <th class="m" rowspan="2">Semanas</th>
          </tr>
          <tr>${W.map(t=>`<th title="${lab(t)}">${fmt(t)}</th>`).join('')}</tr>
        </thead>
        <tbody>
          ${ts.map(t=>{
            const userWeeks = W.filter((_, idx) => t.w.includes(K[idx])).map(t => fmt(t));
            return `
            <tr class="pl">
              <th class="r">
                <div style="font-weight:700">${e(t.n)}</div>${isAll ? `<span class="badge-off">${e(t.o)}</span>` : ''}
                <div style="font-weight:400; font-size:10px; color:var(--mov-muted); margin-top:2px;">
                  ${userWeeks.length ? userWeeks.map(w => `<span class="wk-chip">${w}</span>`).join('') : 'Sin semanas programadas'}
                </div>
              </th>
              ${K.map((k,i)=>{
                const h=t.w.includes(k);
                return `<td class="${h?'x':''}" title="${e(t.n)} · Semana ${lab(W[i])}" onclick="tog(${t.id},'${k}')">${h?'✓':''}</td>`;
              }).join('')}
              <th style="background:#F0F5F9">${K.filter(k=>t.w.includes(k)).length}</th>
            </tr>`;
          }).join('') || '<tr><td colspan="55">No hay técnicos asignados en esta vista.</td></tr>'}
        </tbody>
        <tfoot>
          <tr>
            <th class="r">Técnicos de Vacaciones<small>${ts.length} total</small></th>
            ${c.map((v,i)=>cell(v, ts.length, `${v}/${ts.length} téc. · ${lab(W[i])}`, -1)).join('')}
            <th>${c.reduce((a,b)=>a+b,0)}</th>
          </tr>
          <tr>
            <th class="r">% Ausentismo</th>
            ${c.map(v=>`<td>${v ? Math.round(v/n*100)+'%' : ''}</td>`).join('')}
            <th></th>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>`;
}

/* --- VISTA: ABM TÉCNICOS Y OFICINAS --- */
function abm(){
  const ts=[...S.t].sort((a,b)=>S.o.indexOf(a.o)-S.o.indexOf(b.o)||a.n.localeCompare(b.n));
  const K=wk(S.y).map(iso);

  return `
  <div class="card">
    <h3>Alta de Nuevo Técnico</h3>
    <div class="f">
      <input id="nn" type="text" placeholder="APELLIDO, NOMBRE" style="width:280px">
      <select id="no">${opts(S.o[0])}</select>
      <button class="btn" onclick="addT()">➕ Agregar Técnico</button>
    </div>
  </div>

  <div class="card">
    <h3>Nómina de Técnicos (${S.t.length})</h3>
    <table class="tb">
      <thead>
        <tr><th>Nombre Completo</th><th>Oficina Asignada</th><th>Semanas ${S.y}</th><th>Semanas Programadas</th><th>Acción</th></tr>
      </thead>
      <tbody>
        ${ts.map(t=>{
          const assigned = wk(S.y).filter((_, idx) => t.w.includes(K[idx])).map(w => lab(w));
          return `
          <tr>
            <td><input type="text" value="${e(t.n)}" onchange="editT(${t.id},'n',this.value)"></td>
            <td><select onchange="editT(${t.id},'o',this.value)">${opts(t.o)}</select></td>
            <td><b>${K.filter(k=>t.w.includes(k)).length}</b> sem.</td>
            <td>${assigned.length ? assigned.map(a => `<span class="wk-chip">${a}</span>`).join(' ') : '<i>Ninguna</i>'}</td>
            <td><button class="del" onclick="delT(${t.id})">Eliminar</button></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  </div>

  <div class="card">
    <h3>Gestión de Oficinas Técnicas</h3>
    ${S.o.map((o,i)=>`
      <div class="of">
        <input type="text" value="${e(o)}" onchange="renO(${i},this.value)">
        <span style="color:var(--mov-muted)">${S.t.filter(t=>t.o==o).length} técnicos</span>
        <button class="del" onclick="delO(${i})">Eliminar Oficina</button>
      </div>
    `).join('')}
    <div class="f" style="margin-top:14px">
      <input id="no2" type="text" placeholder="Nombre nueva oficina">
      <button class="btn" onclick="addO()">➕ Agregar Oficina</button>
    </div>
  </div>`;
}

function render(){
  const w=$('.wrap'), s=w&&[w.scrollLeft, w.scrollTop];$('#app').innerHTML = V=='d' ? dash() : V=='p' ? plan() : abm();
  document.querySelectorAll('header button[data-v]').forEach(b=>b.classList.toggle('on', b.dataset.v==V));
  const w2=$('.wrap'); if(s&&w2){ w2.scrollLeft=s[0]; w2.scrollTop=s[1]; }
}

function tog(id,k){
  const t=S.t.find(t=>t.id==id), i=t.w.indexOf(k);
  if(i<0) t.w.push(k); else t.w.splice(i,1);
  save(); render();
}

function addT(){
  const n=$('#nn').value.trim().toUpperCase();
  if(!n || !S.o.length) return;
  S.t.push({id:++nid, n, o:$('#no').value, w:[]});
  save(); render();
}

function delT(id){
  if(confirm('¿Eliminar técnico y sus semanas de vacaciones?')){
    S.t=S.t.filter(t=>t.id!=id); save(); render();
  }
}

function editT(id,f,v){
  const t=S.t.find(t=>t.id==id);
  t[f] = f=='n' ? v.trim().toUpperCase() : v;
  save(); render();
}

function addO(){
  const n=$('#no2').value.trim();
  if(!n || S.o.includes(n)) return;
  S.o.push(n); save(); render();
}

function renO(i,v){
  v=v.trim(); if(!v || S.o.includes(v)) return render();
  S.t.forEach(t=>{ if(t.o==S.o[i]) t.o=v; });
  if(F==S.o[i]) F=v;
  S.o[i]=v; save(); render();
}

function delO(i){
  if(S.t.some(t=>t.o==S.o[i])) return alert('Debes reasignar o eliminar los técnicos de esta oficina primero.');
  if(confirm('¿Eliminar oficina?')){ S.o.splice(i,1); save(); render(); }
}

function dl(n,x,t){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([x],{type:t}));
  a.download=n; a.click();
}

function csv(){
  const W=wk(S.y), K=W.map(iso);
  dl('vacaciones-movistar-'+S.y+'.csv', '\ufeff'+[
    ['Técnico','Oficina',...W.map(lab)].join(';'),
    ...S.t.map(t=>[t.n, t.o, ...K.map(k=>t.w.includes(k)?'X':'')].join(';'))
  ].join('\n'), 'text/csv');
}

function imp(i){
  const r=new FileReader();
  r.onload=()=>{
    try {
      const d=JSON.parse(r.result);
      if(!Array.isArray(d.o) || !Array.isArray(d.t)) throw 0;
      S=d; nid=Math.max(0,...S.t.map(t=>t.id)); F='ALL'; save(); init();
    } catch(x){ alert('Archivo de backup no válido.'); }
  };
  r.readAsText(i.files[0]); i.value='';
}

function init(){
  $('#ys').innerHTML=[2026,2027,2028,2029,2030].map(y=>`<option ${y==S.y?'selected':''}>${y}</option>`).join('');
  $('#u').value=S.u; render();
}

init();
</script>
</body>
</html>
